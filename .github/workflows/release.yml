# Builds and publishes a release when a version tag (e.g. v0.1.0) is pushed:
# the wheel and sdist go to PyPI, and the same files plus a zipapp
# (wdl-lsp-tools.pyz, which the Zed WDL extension downloads) go to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check that the tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/wdl_lsp_tools/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Build wheel and sdist
        run: uv build
      - name: Build zipapp
        # Kept out of dist/ because the PyPI upload step publishes everything in it.
        run: |
          mkdir zipapp
          python3 -m zipapp src -m "wdl_lsp_tools.cli:main" -p "/usr/bin/env python3" -o zipapp/wdl-lsp-tools.pyz
          python3 zipapp/wdl-lsp-tools.pyz --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            zipapp/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Lets PyPI verify this workflow through trusted publishing, so no API token is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* zipapp/wdl-lsp-tools.pyz --repo "$GITHUB_REPOSITORY" --generate-notes
